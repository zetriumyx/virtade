name: virtade
on: [push, pull_request]

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo run -p virt --example three_plugins --locked
      - run: cargo run -p virt --example baseline --locked
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm build
      - run: pnpm --filter @virtade/desktop exec playwright install --with-deps chromium
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/desktop/test-results
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Linux WebView prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo clippy -p virtade-desktop --features desktop,custom-protocol --locked -- -D warnings
      - run: pnpm --filter @virtade/desktop tauri build --no-bundle
      - name: Native WebView / IPC smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/virtade-smoke-data"
          export VIRTADE_SMOKE_REPORT="$RUNNER_TEMP/virtade-native-smoke.json"
          cargo build -p virtade-desktop --features native-smoke,custom-protocol --locked
          timeout 40 xvfb-run -a target/debug/virtade-desktop
          cat "$VIRTADE_SMOKE_REPORT"
          node -e "if (!require(process.env.VIRTADE_SMOKE_REPORT).ok) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            target/release/virtade-desktop
            target/release/virtade-desktop.exe
